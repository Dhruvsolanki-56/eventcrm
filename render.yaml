services:
  - type: web
    name: gather-crm-demo-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: GATHER_DEMO_MODE
        value: "true"
      - key: DATABASE_PATH
        value: /tmp/gather.sqlite
      - key: UPLOADS_PATH
        value: /tmp/gather-demo-uploads
      - key: AI_MODE
        value: provider
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      # Browser transcription uses onnxruntime-web. The server does not need
      # the extra Linux CUDA binaries downloaded by onnxruntime-node at install.
      - key: ONNXRUNTIME_NODE_INSTALL
        value: skip
      - key: REQUIRE_EMAIL_VERIFICATION
        value: "false"
      - key: DEMO_PASSWORD
        value: Gather-Demo-2026!
